# 1. Cổng chạy ứng dụng và Context Path
server.port=8081
server.servlet.context-path=/BAI2

# 2. Cấu hình View Resolver cho JSP
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# 3. Kết nối CSDL SQL Server
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=ShoppingServiceMVC;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 4. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 5. GIỮ NGUYÊN TÊN CỘT TRONG MODEL (Khắc phục lỗi Invalid column name 'category_id')
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 6. Cấu hình dung lượng upload ảnh
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# 7. Thư mục lưu file vật lý cục bộ
app.upload.dir=C:/upload/